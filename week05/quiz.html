<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML & CSS Quiz</title>

    <link rel="stylesheet" href="styles/quiz.css">
</head>
<body>

    <header>
        <h1>HTML & CSS Knowledge Quiz</h1>
    </header>

    <main>
        <form>

            <!-- Question 1: Text Input -->
            <div class="form-item">
                <label for="q1">1. What does HTML stand for?</label>
                <input type="text" id="q1" name="q1" placeholder="Enter your answer">
            </div>

            <!-- Question 2: Textarea -->
            <div class="form-item">
                <label for="q2">2. Describe what CSS is used for:</label>
                <textarea id="q2" name="q2" rows="4" placeholder="Type your explanation here"></textarea>
            </div>

            <!-- Question 3: Select -->
            <div class="form-item">
                <label for="q3">3. Which of the following is a CSS property?</label>
                <select id="q3" name="q3">
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="color">color</option>
                    <option value="document.write">document.write</option>
                    <option value="href">href</option>
                </select>
            </div>

            <!-- Question 4: Number Input -->
            <div class="form-item">
                <label for="q4">4. How many heading levels does HTML have?</label>
                <input type="number" id="q4" name="q4" min="1" max="10" placeholder="Enter a number">
            </div>

            <!-- Submit Button -->
            <button type="submit">Submit Quiz</button>

        </form>
    </main>

</body>
</html>
